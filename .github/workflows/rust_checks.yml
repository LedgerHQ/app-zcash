name: Rust checks

# Two checks `RUST.instructions.md` asks for that no reusable workflow provides: auditing the
# dependency tree, and running the crypto crate's unit tests.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  cargo_audit:
    name: Audit dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install cargo-audit
        # Not shipped in the dev-tools image.
        run: cargo install cargo-audit --locked

      - name: Check that the lockfile matches the manifest
        # cargo audit reads the committed Cargo.lock. Without this step nothing proves that
        # this lockfile describes the graph the manifest asks for, so a pull request could move a
        # dependency requirement, leave the old lockfile in place, and have the audit clear a
        # graph that no build ever compiles. `cargo audit` is not a build command and takes no
        # --locked of its own, hence a separate check rather than a flag.
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Audit
        # Advisories judged not impactful are listed in .cargo/audit.toml with the dependency
        # path that makes them unreachable. Anything else fails here.
        run: cargo audit

  unit_tests:
    name: Run the ledger_zcash_crypto unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    env:
      # Speculos brings up a Qt window otherwise.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cargo test
        # These are SDK `TestType` cases executed by `sdk_test_runner` under Speculos, so they
        # need a device target rather than the host; the runner comes from .cargo/config.toml.
        run: cargo test --locked -p ledger_zcash_crypto --features unit_test --target apex_p
