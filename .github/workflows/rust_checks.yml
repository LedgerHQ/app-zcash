name: Rust checks

# Checks `RUST.instructions.md` asks for that no reusable workflow provides: auditing the
# dependency tree, running the unit tests of both crates, and the I/O boundary regressions.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  cargo_audit:
    name: Audit dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install cargo-audit
        # Not shipped in the dev-tools image.
        run: cargo install cargo-audit --locked

      - name: Check that the lockfile matches the manifest
        # cargo audit reads the committed Cargo.lock. Without this step nothing proves that
        # this lockfile describes the graph the manifest asks for, so a pull request could move a
        # dependency requirement, leave the old lockfile in place, and have the audit clear a
        # graph that no build ever compiles. `cargo audit` is not a build command and takes no
        # --locked of its own, hence a separate check rather than a flag.
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Audit
        # Advisories judged not impactful are listed in .cargo/audit.toml with the dependency
        # path that makes them unreachable. Anything else fails here.
        run: cargo audit

  unit_tests:
    name: Run the unit tests and I/O regressions
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    env:
      # Speculos brings up a Qt window otherwise.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cargo test (ledger_zcash_crypto)
        # These are SDK `TestType` cases executed by `sdk_test_runner` under Speculos, so they
        # need a device target rather than the host; the runner comes from .cargo/config.toml.
        # Built in the shipping profile: the test binary competes for the device's flash, and
        # a case that links a software reference implementation to cross-check against does
        # not fit there unoptimised. Release is also the codegen the application ships with.
        run: cargo test --release --locked -p ledger_zcash_crypto --features unit_test --target apex_p

      - name: Cargo test (zcash)
        # Same harness on the application crate. A crash in a case under test takes the whole
        # Speculos run down rather than failing one case, so this step is also what catches a
        # memory fault reached from parsing.
        run: cargo test --locked -p zcash --features unit_test --target apex_p

      - name: I/O boundary regressions
        run: python3 tests/io-regression/run.py

  key_reuse_vectors:
    name: Check the key derivation against public vectors
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    env:
      # Speculos brings up a Qt window otherwise.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build and run the vectors under Speculos
        # The harness is deliberately outside the workspace — its SDK unit-test feature must
        # not unify into an application build — so it carries its own lockfile and cannot ride
        # the `cargo test` steps above. `--no-run` yields a device executable that Speculos
        # runs; the SDK runner exits non-zero on a failing case, which fails this step.
        # The executable path comes from cargo's own JSON output, not a glob over the deps
        # directory: cargo also emits a same-prefix, no-extension `-rodata-reloc` sibling
        # artifact there, which a name pattern cannot tell apart from the real ELF.
        run: |
          export LEDGER_SDK_PATH="$FLEX_SDK"
          elf=$(cargo test --manifest-path tests/key-reuse/Cargo.toml --lib --no-run --release --target flex --locked --message-format=json \
            | python3 -c 'import sys, json
          for line in sys.stdin:
              msg = json.loads(line)
              if msg.get("executable"):
                  print(msg["executable"])')
          test -n "$elf"
          speculos --model flex --display headless "$elf"
