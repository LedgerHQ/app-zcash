[package]
name = "ledger-key-reuse-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ledger_device_sdk = { version = "1.41.0", features = ["sys", "unit_test"] }
ledger_zcash_crypto = { path = "../../ledger_zcash_crypto" }
orchard = { path = "../../vendor/orchard", default-features = false, features = ["ledger"] }
pasta_curves = { version = "0.6", default-features = false, features = ["alloc", "repr-c"] }
ff = { version = "0.14", default-features = false }

[patch.crates-io]
# Same vendored patches as the root manifest.
radium = { path = "../../vendor/radium" }
secp256k1 = { path = "../../vendor/secp256k1" }
secp256k1-sys = { path = "../../vendor/secp256k1-sys" }
orchard = { path = "../../vendor/orchard" }
sapling-crypto = { path = "../../vendor/sapling-crypto" }
spin = { path = "../../vendor/spin" }
portable-atomic = { git = "https://github.com/taiki-e/portable-atomic.git", tag = "v1.12.0" }
reddsa = { path = "../../vendor/reddsa" }


[profile.release]
opt-level = "z"
lto = "fat"
