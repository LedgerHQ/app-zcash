[package]
name = "zcash"
version = "3.0.0"
authors = ["Ledger"]
edition = "2024"

[dependencies]
#ledger_device_sdk = { version = "1.34.0", features = ["sys"] }
ledger_device_sdk = { git = "https://github.com/Fingolfin69/ledger-device-rust-sdk.git", branch = "y333/zip32_derivation_support_build_ci_fix", features = ["sys"] }
ledger_zcash_crypto = { path = "ledger_zcash_crypto" }
core2 = { version = "0.3.0", default-features = false }
arrayvec = { version = "0.7.6", default-features = false }
bs58 = { version = "0.5.1", default-features = false }

zcash_primitives = { git = "https://github.com/Fingolfin69/librustzcash.git", branch = "bn-zcash-device-app", default-features = false }
zcash_protocol = { git = "https://github.com/Fingolfin69/librustzcash.git", branch = "bn-zcash-device-app", default-features = false }
zcash_encoding = { git = "https://github.com/Fingolfin69/librustzcash.git", branch = "bn-zcash-device-app", default-features = false }
zcash_transparent = { git = "https://github.com/Fingolfin69/librustzcash.git", branch = "bn-zcash-device-app", default-features = false }

orchard = { path = "./vendor/orchard", default-features = false }
num_enum = { version = "0.7.5", default-features = false }
zeroize = { version = "1.6.0", default-features = false }

[patch.crates-io]
# Used in orchard
radium = { path = "./vendor/radium" }
# Used in bip32 in librustzcash
secp256k1 = { path = "./vendor/rust-secp256k1" }
# Used in librustzcash
orchard = { path = "./vendor/orchard" }
sapling-crypto = { path = "./vendor/sapling-crypto" }
# Used by multiple deps
spin = { path = "./vendor/spin" }
portable-atomic = { git = "https://github.com/taiki-e/portable-atomic.git", tag = "v1.12.0" }
reddsa = { path = "./vendor/reddsa" }

[build-dependencies]
image = "0.25.7"

[profile.release]
opt-level = 'z'
lto = 'fat'

[features]
default = ["ledger_device_sdk/nano_nbgl", "legacy_path", "test_zip32_stub"]

# Enables debug logging
debug = ["ledger_device_sdk/debug", "ledger_device_sdk/log_debug"]

legacy_path = []
# TODO: Remove this once speculos supports ZIP32 derivations
test_zip32_stub = []

[package.metadata.ledger]
curve = ["secp256k1"]
# TODO: change when speculos supports ZIP32 derivations
#curve = ["secp256k1", "jubjub"]
path = ["44'/133'", "32'/133'"]
name = "Zcash"
flags = "0x800"

[package.metadata.ledger.nanox]
icon = "icons/nanox_app_zcash.gif"

[package.metadata.ledger.nanosplus]
icon = "icons/nanox_app_zcash.gif"

[package.metadata.ledger.stax]
icon = "icons/stax_app_zcash.gif"

[package.metadata.ledger.flex]
icon = "icons/flex_app_zcash.gif"

[package.metadata.ledger.apex_p]
icon = "icons/apex_app_zcash.gif"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("apex_p", "stax", "flex", "nanos", "nanox", "nanosplus"))',
] }
