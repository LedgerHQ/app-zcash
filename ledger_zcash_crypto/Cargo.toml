[package]
name = "ledger_zcash_crypto"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
ledger_device_sdk = { workspace = true }
chacha20poly1305 = { version = "0.10", default-features = false }
chacha20 = { version = "0.9", default-features = false }
ff = { version = "0.13", default-features = false }
# `alloc` provides the imported `arithmetic::CurveAffine`; without it this crate builds only
# through the app's feature unification, never standalone.
pasta_curves = { version = "0.5", default-features = false, features = ["alloc"] }

[features]
# Enables the Ledger SDK on-device unit-test framework (TestType / sdk_test_runner). The V3
# tests also need `zcash_unstable`, and the runner needs a device target:
#   QT_QPA_PLATFORM=offscreen cargo test -p ledger_zcash_crypto \
#       --features unit_test,zcash_unstable --target apex_p
unit_test = ["ledger_device_sdk/unit_test"]
# Gates V3 (Ironwood / ZIP 2005) note-plaintext and note-commitment support.
# Must be enabled whenever the app crate's `zcash_unstable` feature is active.
zcash_unstable = []
